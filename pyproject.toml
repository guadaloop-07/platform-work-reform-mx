[project]
name = "platform-work-reform-mx"
version = "0.1.0"
description = "Reproducible research on Mexico's digital platform labor reform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "ruff>=0.12,<1",
    "pytest>=8,<10",
    "nbstripout>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_work_reform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL database"]
