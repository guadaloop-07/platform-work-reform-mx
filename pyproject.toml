[project]
name = "platform-work-reform-mx"
version = "0.1.0"
description = "Reproducible research on Mexico's digital platform labor reform"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4.3,<5", "ruff>=0.12,<1", "pytest>=8,<10"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL database"]
