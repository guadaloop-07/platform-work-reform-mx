name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked pre-commit run --all-files --hook-stage manual
      - run: uv run --locked pytest -m 'not integration'
      - name: Validate Compose configuration
        env:
          PWR_POSTGRES_PASSWORD: ci-configuration-only
        run: docker compose config --quiet
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: platform_owner
          POSTGRES_DB: platform_work_reform_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_owner -d platform_work_reform_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PWR_POSTGRES_USER: platform_owner
      PWR_POSTGRES_DB: platform_work_reform_ci
      PWR_POSTGRES_PASSWORD: ci-ephemeral-only
      PWR_POSTGRES_HOST: 127.0.0.1
      PWR_POSTGRES_PORT: "5432"
      PWR_RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -m integration
  ci:
    if: always()
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "$RESULT" = success && test "$DATABASE_RESULT" = success
